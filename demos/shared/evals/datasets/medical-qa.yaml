---
name: medical-qa
description: Medical and healthcare knowledge evaluation dataset
version: 1.0.0
author: Weave Team
tags:
  - medical
  - healthcare
  - knowledge-base

config:
  default_agent: rag-agent
  default_collection: MedicalDocs
  min_accuracy_score: 0.75
  min_citation_score: 0.85
  allow_hallucination: false

test_cases:
  - id: med-001
    description: Basic medical terminology
    query: "What is hypertension?"
    expected_answer: |
      Hypertension is high blood pressure, a condition where the
      force of blood against artery walls is consistently too high.
      It's typically defined as blood pressure above 140/90 mmHg.
    expected_citations:
      - "hypertension"
      - "blood pressure"
    required_concepts:
      - "blood pressure"
      - "high"
      - "artery"
    must_cite: true
    min_relevance_score: 0.75

  - id: med-002
    description: Medication information
    query: "What are the common side effects of statins?"
    expected_answer: |
      Common side effects of statins include muscle pain and
      weakness, digestive problems, increased blood sugar levels,
      and in rare cases, liver damage. Most people tolerate statins
      well.
    required_concepts:
      - "muscle"
      - "side effects"
      - "statins"
    must_cite: true
    min_relevance_score: 0.7

  - id: med-003
    description: Diagnostic procedures
    query: "How is diabetes diagnosed?"
    expected_answer: |
      Diabetes is diagnosed through blood tests measuring glucose
      levels. Common tests include fasting plasma glucose (FPG),
      HbA1c test, and oral glucose tolerance test (OGTT). A
      diagnosis requires elevated results on two separate occasions.
    required_concepts:
      - "blood test"
      - "glucose"
      - "diagnosis"
    must_cite: true
    min_relevance_score: 0.75

  - id: med-004
    description: Treatment protocols with multiple citations
    query: "What are the first-line treatments for type 2 diabetes?"
    expected_answer: |
      First-line treatments for type 2 diabetes typically include
      lifestyle modifications such as diet and exercise, along with
      metformin as the initial medication. Blood glucose monitoring,
      weight management, and patient education are also essential
      components of treatment.
    required_concepts:
      - "diabetes"
      - "treatment"
      - "metformin"
      - "lifestyle"
    must_cite: true
    min_relevance_score: 0.8

  - id: med-005
    description: Complex multi-concept query
    query: |
      Explain the relationship between obesity, insulin resistance,
      and type 2 diabetes.
    expected_answer: |
      Obesity is a major risk factor for type 2 diabetes through
      its effect on insulin resistance. Excess body fat, especially
      visceral fat, causes cells to become less responsive to
      insulin. This insulin resistance forces the pancreas to produce
      more insulin, eventually leading to pancreatic exhaustion and
      type 2 diabetes.
    required_concepts:
      - "obesity"
      - "insulin"
      - "resistance"
      - "diabetes"
      - "pancreas"
    must_cite: true
    min_relevance_score: 0.8
