---
# Weaviate Cloud Configuration Example
# This is a complete configuration file for using Weaviate Cloud with weave-cli
#
# Prerequisites:
# 1. Weaviate Cloud account (free sandbox available)
# 2. Weaviate cluster created
# 3. API key and cluster URL in .env file
#
# Environment variables needed:
# - WEAVIATE_URL: Weaviate Cloud cluster URL
# - WEAVIATE_API_KEY: Weaviate Cloud API key
# - OPENAI_API_KEY: OpenAI API key for embeddings

databases:
  # Set Weaviate Cloud as the default database
  default: weaviate-cloud

  vector_databases:
    # Weaviate Cloud configuration
    - name: weaviate-cloud
      type: weaviate-cloud

      # Weaviate Cloud cluster URL (from .env)
      # Format: https://your-cluster-id.c0.region.cloud-provider.weaviate.cloud
      # Get from: https://console.weaviate.cloud/
      url: ${WEAVIATE_URL}

      # Weaviate Cloud API key (from .env)
      # Get from: https://console.weaviate.cloud/ > Details > API Keys
      api_key: ${WEAVIATE_API_KEY}

      # OpenAI API key for embeddings (from .env)
      # Get from: https://platform.openai.com/api-keys
      openai_api_key: ${OPENAI_API_KEY}

      # Timeout in seconds for database operations
      timeout: 10

      # Collections to create/use
      collections:
        - name: WeaveDocs
          type: text
          description: Main text documents collection for semantic search

        - name: WeaveImages
          type: image
          description: Image documents collection with CLIP embeddings

    # Weaviate Local configuration (commented out - uncomment to use)
    # - name: weaviate-local
    #   type: weaviate-local
    #   url: http://localhost:8080
    #   openai_api_key: ${OPENAI_API_KEY}
    #   timeout: 10
    #   collections:
    #     - name: WeaveDocs
    #       type: text
    #       description: Main text documents collection
    #     - name: WeaveImages
    #       type: image
    #       description: Image documents collection

# Optional: Schemas directory for custom collection schemas
# schemas_dir: ./schemas

# Notes:
# - Weaviate Cloud offers a free sandbox tier with limited resources
# - Supports multiple embedding providers: OpenAI, Cohere, Hugging Face, etc.
# - Automatic vectorization based on collection schema configuration
# - Supports semantic search, hybrid search (vector + BM25), and filtering
# - For local development, use Docker:
#   docker run -p 8080:8080 semitechnologies/weaviate
# - Local Weaviate doesn't require API key, only OpenAI key for embeddings
# - Production clusters available on AWS, GCP, and Azure
