---
codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: "20...80"

  status:
    project:
      default:
        target: 20%        # Day 2 project milestone
        threshold: 1%      # Prevent meaningful regressions while coverage grows
        if_ci_failed: error

    patch:
      default:
        target: 80%        # New and changed code should meet the long-term goal
        threshold: 5%

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: false

ignore:
  - "tests/"
  - "**/*_test.go"
  - "**/*_mock.go"
  - "tools/"
  - "demos/"
  - "local/"
  - "configs/"
  - "docs/"
